<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar Dinero</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand" href="menu.html">
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="sendmoney.html">
                            Enviar Dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

                <span
                    id="navbarBalance"
                    class="text-white fw-bold">
                </span>

            </div>

        </div>

    </nav>

    <!-- Contenido -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">

                        <h4 class="mb-0">
                            Datos del Destinatario
                        </h4>

                    </div>

                    <div class="card-body">

                        <form id="formulario">

                            <div class="mb-3">

                                <label for="fullname" class="form-label">
                                    Nombre Completo
                                </label>

                                <input
                                    type="text"
                                    id="fullname"
                                    name="fullname"
                                    class="form-control"
                                    placeholder="Ingrese el nombre completo">

                            </div>

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Correo Electrónico
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="correo@ejemplo.cl">

                            </div>

                            <div class="mb-3">

                                <label for="accountNumber" class="form-label">
                                    Número de Cuenta
                                </label>

                                <input
                                    type="number"
                                    id="accountNumber"
                                    name="accountNumber"
                                    class="form-control"
                                    placeholder="Ingrese el número de cuenta">

                            </div>

                            <div class="mb-3">

                                <label for="accountType" class="form-label">
                                    Tipo de Cuenta
                                </label>

                                <input
                                    type="text"
                                    id="accountType"
                                    name="accountType"
                                    class="form-control"
                                    placeholder="Cuenta Corriente / Vista">

                            </div>

                            <div class="mb-3">

                                <label for="bank" class="form-label">
                                    Banco
                                </label>

                                <input
                                    type="text"
                                    id="bank"
                                    name="bank"
                                    class="form-control"
                                    placeholder="Nombre del banco">

                            </div>

                            <div class="mb-4">

                                <label for="transferAmount" class="form-label">
                                    Monto a Transferir
                                </label>

                                <input
                                    type="number"
                                    id="transferAmount"
                                    name="transferAmount"
                                    min="1"
                                    class="form-control"
                                    placeholder="Ingrese el monto">

                            </div>

                            <button
                                id="btnSendMoney"
                                type="submit"
                                class="btn btn-primary w-100">

                                Enviar Dinero

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../JS/sendmoney.js"></script>

</body>

</html>
